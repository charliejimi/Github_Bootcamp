<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="簡潔好用的離線待辦清單">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="todo-card">
    <header class="app-header">
      <span class="app-icon" aria-hidden="true">✓</span>
      <div>
        <p class="eyebrow">TODAY</p>
        <h1>我的待辦清單</h1>
      </div>
    </header>

    <!-- 新增待辦事項的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        maxlength="100"
        placeholder="輸入待辦事項..."
        required
      >
      <button class="add-button" type="submit">新增</button>
    </form>

    <!-- 待辦項目會由 app.js 動態加入 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-state" class="empty-state" hidden>
      還沒有任何待辦事項,新增一個吧!
    </p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
